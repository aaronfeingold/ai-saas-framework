packages:
  - "apps/*"
  - "template/apps/*"
  - "template/packages/*"
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  protobufjs: true
  sharp: true
  "@swc/core": true
  "@tailwindcss/oxide": true
  unrs-resolver: true
overrides:
  # One hono for the kit and the API, so their types line up
  hono: 4.13.13
